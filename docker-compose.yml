services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bathroom-vent-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  automation:
    build:
      context: .
      dockerfile: automation/Dockerfile
    container_name: bathroom-vent-automation
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
