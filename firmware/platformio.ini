; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit SHT31 Library@^2.2.2
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -Wall
    -Wextra

; Hardware-independent unit tests for the pure controller logic - compiled
; and run as a native desktop binary, no ESP32 required. This is what
; `docs/testing.md` refers to as "firmware native unit tests".
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Iinclude
build_src_filter = +<*> -<main.cpp>
; Required for `pio test` to compile src/*.cpp (controller.cpp) into the
; test binary at all - without this, PlatformIO's test runner links only
; the test file(s) + Unity, producing "undefined reference" linker errors
; for every VentilationController method.
test_build_src = true
test_filter = test_controller
