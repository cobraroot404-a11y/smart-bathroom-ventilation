name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install automation service dependencies
        run: pip install -r automation/requirements.txt

      - name: Install simulator dependencies
        run: pip install -r simulator/requirements.txt

      - name: Run every feasible automated check
        run: python scripts/run_full_check.py

      - name: Create placeholder secrets.h for compile verification
        # firmware/include/secrets.h is git-ignored (real Wi-Fi/MQTT
        # credentials never get committed - see docs/security.md). The
        # esp32dev build needs some secrets.h to exist to compile at all,
        # so use the same placeholder example file the README tells a
        # real user to copy - never real credentials.
        run: cp firmware/include/secrets.example.h firmware/include/secrets.h

      - name: Compile firmware for esp32dev (build-only, no flashing)
        working-directory: firmware
        run: pio run -e esp32dev
