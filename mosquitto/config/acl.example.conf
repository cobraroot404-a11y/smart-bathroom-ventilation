# Example topic-level ACL. Copy to mosquitto/config/acl.conf (git-ignored)
# and uncomment `acl_file` in mosquitto.conf to enforce it - see
# docs/security.md.
#
# Usernames here must match the accounts created with
# scripts/generate_mosquitto_passwd.sh (or .ps1).

user bathroom-vent-device
topic read bathroom/ventilation/fan/desired
topic read bathroom/ventilation/command
topic write bathroom/ventilation/telemetry
topic write bathroom/ventilation/sensor/humidity
topic write bathroom/ventilation/sensor/temperature
topic write bathroom/ventilation/fan/actual
topic write bathroom/ventilation/mode
topic write bathroom/ventilation/device/status
topic write bathroom/ventilation/sensor/status
topic write bathroom/ventilation/config

user bathroom-automation
topic read bathroom/ventilation/telemetry
topic read bathroom/ventilation/sensor/humidity
topic read bathroom/ventilation/sensor/temperature
topic read bathroom/ventilation/device/status
topic write bathroom/ventilation/fan/desired
topic write bathroom/ventilation/command
