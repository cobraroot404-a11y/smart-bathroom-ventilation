# Eclipse Mosquitto configuration for local development/demonstration.
# See docs/security.md before using this outside a trusted local network.

listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Topic-level access control (recommended, disabled by default so the
# quick-start demo works without extra setup - see docs/security.md).
# Copy mosquitto/config/acl.example.conf to mosquitto/config/acl.conf
# (git-ignored) and uncomment the line below to enforce it:
# acl_file /mosquitto/config/acl.conf

# TLS (required if MQTT traffic ever leaves a trusted local network -
# see docs/security.md). Disabled by default for the local demo:
# listener 8883
# cafile /mosquitto/config/ca.crt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key
